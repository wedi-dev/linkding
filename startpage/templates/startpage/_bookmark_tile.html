<div class="item-box">
  <a class="item-box-link"
     href="{{ item.url }}"
     target="{{ widget.link_target }}"
     rel="noopener"
     aria-label="{{ item.title }}"></a>
  <div class="item-box-top">
    {% if widget.show_favicons and item.favicon_file %}
      <img class="favicon"
           src="/static/{{ item.favicon_file }}"
           width="16"
           height="16"
           alt=""
           loading="lazy">
    {% endif %}
    <span class="item-box-name">{{ item.title }}</span>
    <a class="item-box-edit"
       href="{% url 'linkding:bookmarks.edit' item.id %}?return_url={{ request.path }}"
       aria-label="Edit bookmark">
      <svg width="14"
           height="14"
           viewBox="0 0 16 16"
           fill="none"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M11.5 2.5l2 2-8 8H3.5v-2l8-8zM10 4l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </div>
  <span class="item-box-url">{{ item.url }}</span>
</div>
