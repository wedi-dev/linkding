[uwsgi]
module = bookmarks.wsgi:application
env = DJANGO_SETTINGS_MODULE=bookmarks.settings.prod
# Static files are served by Django (WhiteNoise middleware + the dynamic
# /static/<path> view for favicons/previews). No uWSGI static-map needed.
processes = 2
threads = 2
pidfile = /tmp/linkding.pid
vacuum=True
stats = 127.0.0.1:9191
buffer-size = 8192
die-on-term = true

if-env = LD_UWSGI_UID
uid = %(_)
endif =

if-env = LD_UWSGI_GID
gid = %(_)
endif =

if-env = LD_REQUEST_TIMEOUT
http-timeout = %(_)
socket-timeout = %(_)
harakiri = %(_)
endif =

if-env = LD_REQUEST_MAX_CONTENT_LENGTH
limit-post = %(_)
endif =

if-env = LD_LOG_X_FORWARDED_FOR
log-x-forwarded-for = %(_)
endif =

if-env = LD_DISABLE_REQUEST_LOGS=true
disable-logging = true
log-4xx = true
log-5xx = true
endif =
